syntax = "proto3";

package minion;


message RouteHash {
  bytes id = 1;
  repeated bytes targetIds = 2;
  repeated uint32 hashRanges = 3;
  uint32 hashSize = 4;
  repeated string properties = 5;
  uint32 seed = 6;

  // float distanceScore = 9; // how hard weight hash distances when routing new resources ; default = 0.0
  // TODO: better distance computation - universal by properties ?
};

message RouteScore {
  bytes id = 1;
  repeated bytes targetIds = 2;
  repeated float scores = 3;
};
