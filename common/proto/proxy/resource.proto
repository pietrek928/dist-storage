syntax = "proto3";

package proxy.resource;

import "tel.proto";

enum ResourceResult {
  OK = 0;
  FAILED = 1;
  NOT_ENOUGH = 2;
  KEY_NOT_FOUND = 3;
  NOT_AUTHORIZED = 4;
};

// // Inits billing and returns auth paths - also confirms auth
message ResourceRequest {
  repeated string billingKeys = 1;
  repeated string limitKeys = 2;
  map<string, double> resourceKeys = 3;
};

message ResourceAppend { map<string, double> resourceKeys = 1; };
message ResourceOverride { map<string, double> resourceKeys = 1; };

// send ResourceFinish to confirm billing operation finish
message ResourceFinish { tel.OperationResult result = 1; };

message ResourceRequestUnion {
  oneof v {
    ResourceRequest resourceRequest = 1;
    ResourceAppend resourceAppend = 2;
    ResourceOverride resourceOverride = 3;
    ResourceFinish resourceFinish = 4;
  };
};

message ResourceResponse { tel.OperationResult result = 1; };

service Resource {
  rpc ResourceSession(stream ResourceRequestUnion)
      returns (stream ResourceResponse);
};
