syntax = "proto3";

package auth;


message AccessGrant {
  int64 startTimestamp_s = 1;
  int64 endTimestamp_s = 2;
  repeated string grantToRoles = 3;
  repeated string resourceKeyPrefixes = 4;
};

message RoleMapping {
  int64 startTimestamp_s = 1;
  int64 endTimestamp_s = 2;
  string grantToRoles = 3;
  string roles = 4;
};

message LimitConfig {
  string key = 1;
  repeated string limitedRoles = 2;
  repeated string resourceKeyPrefixes = 3;
  int64 startTimestamp_s = 4;
  int64 endTimestamp_s = 5;
  float accumThresh = 6;
  float accumAlpha = 7;
};

message BillingConfig {
  string key = 1;
  repeated string billedRoles = 2;
  repeated string resourceKeyPrefixes = 3;
  int64 startTimestamp_s = 4;
  int64 endTimestamp_s = 5;
  float billingLimit = 6;
  float billingWindow_s = 7;
};

message ResourceConfig {
  repeated AccessGrant grants = 1;
  repeated RoleMapping roleMappings = 2;
  repeated LimitConfig limitConfigs = 3;
  repeated BillingConfig billingConfigs = 4;
};
