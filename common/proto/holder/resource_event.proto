syntax = "proto3";

package holder.resource_event;

import "tel.proto";


message ResourceEventFilter {
    repeated string resourceKeyPrefixes = 1;
    int64 startTimestamp_s = 2;
    int64 endTimestamp_s = 3;
    repeated string billingKeys = 4;
    repeated string limitKeys = 5;
    repeated bytes billerIds = 6;
};

message ResourceEvent {
  bytes eventId = 1;
  string resourceKey = 2;
  int64 timestamp_s = 3;
  double amount = 4;
  repeated string billingKeys = 5;
  repeated string limitKeys = 6;
  bytes billerId = 7;
};

message AppendRequest { repeated ResourceEvent events = 1; };

message AppendResult { tel.OperationResult result = 1; };

message GetRequest {
  ResourceEventFilter filter = 1;
  int64 limit = 2;
};

message GetResponse { repeated ResourceEvent events = 1; };

message FlushResponse {
  tel.OperationResult result = 1;
  int64 count = 2;
};

service Bill {
  rpc Append(AppendRequest) returns (AppendResult);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Flush(ResourceEventFilter) returns (FlushResponse);
};
